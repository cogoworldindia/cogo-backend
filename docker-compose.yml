# CoGo local stack. Use the Makefile (`make up`): it passes both env files
#   docker compose --env-file .env --env-file .env.secrets ...
# Only the gateway (and dev UIs) are published, all on 127.0.0.1.
name: cogo

x-service: &service
  restart: unless-stopped
  networks: [backend]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-common-env: &common-env
  ENV: ${ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-auth-db-url: &auth-db-url postgresql+asyncpg://${AUTH_DB_USER:-auth_svc}:${AUTH_DB_PASSWORD:?run make secrets}@postgres:5432/${AUTH_DB:-authdb}
x-user-db-url: &user-db-url postgresql+asyncpg://${USER_DB_USER:-user_svc}:${USER_DB_PASSWORD:?run make secrets}@postgres:5432/${USER_DB:-userdb}
x-journey-db-url: &journey-db-url postgresql+asyncpg://${JOURNEY_DB_USER:-journey_svc}:${JOURNEY_DB_PASSWORD:?run make secrets}@postgres:5432/${JOURNEY_DB:-journeydb}
x-social-db-url: &social-db-url postgresql+asyncpg://${SOCIAL_DB_USER:-social_svc}:${SOCIAL_DB_PASSWORD:?run make secrets}@postgres:5432/${SOCIAL_DB:-socialdb}
x-chat-db-url: &chat-db-url postgresql+asyncpg://${CHAT_DB_USER:-chat_svc}:${CHAT_DB_PASSWORD:?run make secrets}@postgres:5432/${CHAT_DB:-chatdb}
x-notification-db-url: &notification-db-url postgresql+asyncpg://${NOTIFICATION_DB_USER:-notification_svc}:${NOTIFICATION_DB_PASSWORD:?run make secrets}@postgres:5432/${NOTIFICATION_DB:-notificationdb}
# Realtime Redis: chat pub/sub fan-out, presence, message rate limits (chat-api, chat-ws, notification)
x-realtime-redis: &realtime-redis redis://redis:6379/6
# Public keys of every service (verify service tokens); each service gets only its own private key.
x-service-keys: &service-keys ./secrets/service-keys/public:/run/service-keys:ro
x-rabbit-url: &rabbit-url amqp://${RABBITMQ_USER:-cogo}:${RABBITMQ_PASSWORD:?run make secrets}@rabbitmq:5672/

services:
  # ---------------------------------------------------------------- infrastructure
  postgres:
    <<: *service
    image: postgis/postgis:17-3.5  # PostGIS ready for trip/route matching (Phase 3)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make secrets}
      AUTH_DB: ${AUTH_DB:-authdb}
      AUTH_DB_USER: ${AUTH_DB_USER:-auth_svc}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?run make secrets}
      USER_DB: ${USER_DB:-userdb}
      USER_DB_USER: ${USER_DB_USER:-user_svc}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?run make secrets}
      JOURNEY_DB: ${JOURNEY_DB:-journeydb}
      JOURNEY_DB_USER: ${JOURNEY_DB_USER:-journey_svc}
      JOURNEY_DB_PASSWORD: ${JOURNEY_DB_PASSWORD:?run make secrets}
      SOCIAL_DB: ${SOCIAL_DB:-socialdb}
      SOCIAL_DB_USER: ${SOCIAL_DB_USER:-social_svc}
      SOCIAL_DB_PASSWORD: ${SOCIAL_DB_PASSWORD:?run make secrets}
      CHAT_DB: ${CHAT_DB:-chatdb}
      CHAT_DB_USER: ${CHAT_DB_USER:-chat_svc}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:?run make secrets}
      NOTIFICATION_DB: ${NOTIFICATION_DB:-notificationdb}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:-notification_svc}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?run make secrets}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/initdb/20-service-databases.sh:/docker-entrypoint-initdb.d/20-service-databases.sh:ro
    ports: ["127.0.0.1:5433:5432"]  # 5433: doesn't clash with a host Postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *service
    image: redis:7-alpine
    # Sessions/OTPs must never be evicted. In production use separate instances for
    # session data (persistent, noeviction) and cache (allkeys-lru).
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    ports: ["127.0.0.1:6380:6379"]  # for running a service natively (see docs/SETUP.md)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    <<: *service
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cogo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?run make secrets}
    volumes: [rabbitdata:/var/lib/rabbitmq]
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]  # AMQP (native dev) + management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 20

  mailpit:  # dev SMTP sink: every email lands here, nothing is really sent
    <<: *service
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"]

  media-store:  # S3-compatible object store (RustFS); production uses S3/GCS + CDN
    <<: *service
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: ${MEDIA_ACCESS_KEY:?run make secrets}
      RUSTFS_SECRET_KEY: ${MEDIA_SECRET_KEY:?run make secrets}
    volumes: [mediadata:/data]
    ports: ["127.0.0.1:9000:9000"]  # clients upload to presigned URLs and load files here
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || wget -q -O /dev/null http://127.0.0.1:9000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------- auth
  auth-migrate:
    <<: *service
    restart: "no"
    image: cogo/auth-service:dev
    build: &auth-build
      context: ./services/auth
      additional_contexts: { common: ./libs/common }
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: *auth-db-url
    depends_on:
      postgres: { condition: service_healthy }

  auth-service:
    <<: *service
    image: cogo/auth-service:dev
    build: *auth-build
    environment:
      <<: *common-env
      DATABASE_URL: *auth-db-url
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: *rabbit-url
      JWT_ISSUER: ${JWT_ISSUER:-cogo-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-cogo-api}
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      OTP_HMAC_KEY: ${OTP_HMAC_KEY:?run make secrets}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
    secrets: [jwt_private_key]
    depends_on:
      auth-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # ---------------------------------------------------------------- user
  user-migrate:
    <<: *service
    restart: "no"
    image: cogo/user-service:dev
    build: &user-build
      context: ./services/user
      additional_contexts: { common: ./libs/common }
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: *user-db-url
    depends_on:
      postgres: { condition: service_healthy }

  user-service:
    <<: *service
    image: cogo/user-service:dev
    build: *user-build
    environment:
      <<: *common-env
      DATABASE_URL: *user-db-url
      RABBITMQ_URL: *rabbit-url
      AUTH_JWKS_URL: http://auth-service:8000/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-cogo-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-cogo-api}
      JOURNEY_SERVICE_URL: http://journey-service:8000
      SOCIAL_SERVICE_URL: http://social-service:8000
      MEDIA_S3_ENDPOINT: http://media-store:9000
      MEDIA_PRESIGN_ENDPOINT: http://localhost:9000
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:9000/cogo-media}
      MEDIA_ACCESS_KEY: ${MEDIA_ACCESS_KEY:?run make secrets}
      MEDIA_SECRET_KEY: ${MEDIA_SECRET_KEY:?run make secrets}
      MEDIA_DEV_BOOTSTRAP: "true"
    secrets: [{ source: user_service_key, target: service_key }]
    volumes: [*service-keys]
    depends_on:
      user-migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      media-store: { condition: service_healthy }

  # ---------------------------------------------------------------- journey
  journey-migrate:
    <<: *service
    restart: "no"
    image: cogo/journey-service:dev
    build: &journey-build
      context: ./services/journey
      additional_contexts: { common: ./libs/common }
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: *journey-db-url
    depends_on:
      postgres: { condition: service_healthy }

  journey-service:
    <<: *service
    image: cogo/journey-service:dev
    build: *journey-build
    environment:
      <<: *common-env
      DATABASE_URL: *journey-db-url
      REDIS_URL: redis://redis:6379/4
      RABBITMQ_URL: *rabbit-url
      AUTH_JWKS_URL: http://auth-service:8000/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-cogo-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-cogo-api}
      PLACES_PROVIDER: ${PLACES_PROVIDER:-mock}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      SOCIAL_SERVICE_URL: http://social-service:8000
      CURSOR_SECRET: ${CURSOR_SECRET:?run make secrets}
      PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_BASE_URL:-http://localhost:8000}
    secrets: [{ source: journey_service_key, target: service_key }]
    volumes: [*service-keys]
    depends_on:
      journey-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      auth-service: { condition: service_healthy }

  # ---------------------------------------------------------------- social
  social-migrate:
    <<: *service
    restart: "no"
    image: cogo/social-service:dev
    build: &social-build
      context: ./services/social
      additional_contexts: { common: ./libs/common }
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: *social-db-url
    depends_on:
      postgres: { condition: service_healthy }

  social-service:
    <<: *service
    image: cogo/social-service:dev
    build: *social-build
    environment:
      <<: *common-env
      DATABASE_URL: *social-db-url
      RABBITMQ_URL: *rabbit-url
      AUTH_JWKS_URL: http://auth-service:8000/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-cogo-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-cogo-api}
      CURSOR_SECRET: ${CURSOR_SECRET:?run make secrets}
      REDIS_URL: redis://redis:6379/5
    secrets: [{ source: social_service_key, target: service_key }]
    volumes: [*service-keys]
    depends_on:
      social-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      auth-service: { condition: service_healthy }

  # ---------------------------------------------------------------- chat (one image, two deployables)
  chat-migrate:
    <<: *service
    restart: "no"
    image: cogo/chat-service:dev
    build: &chat-build
      context: ./services/chat
      additional_contexts: { common: ./libs/common }
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: *chat-db-url
    depends_on:
      postgres: { condition: service_healthy }

  chat-service:  # chat-api: requests, conversations, internal API, consumers
    <<: *service
    image: cogo/chat-service:dev
    build: *chat-build
    environment:
      <<: *common-env
      DATABASE_URL: *chat-db-url
      RABBITMQ_URL: *rabbit-url
      REDIS_URL: *realtime-redis
      AUTH_JWKS_URL: http://auth-service:8000/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-cogo-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-cogo-api}
      JOURNEY_SERVICE_URL: http://journey-service:8000
      CURSOR_SECRET: ${CURSOR_SECRET:?run make secrets}
    secrets: [{ source: chat_service_key, target: service_key }]
    volumes: [*service-keys]
    depends_on:
      chat-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      auth-service: { condition: service_healthy }

  chat-ws:  # sockets only (stateless); persists through chat-service's internal API
    <<: *service
    image: cogo/chat-service:dev
    build: *chat-build
    command: ["uvicorn", "app.ws.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--no-access-log", "--timeout-graceful-shutdown", "20"]
    environment:
      <<: *common-env
      REDIS_URL: *realtime-redis
      CHAT_API_URL: http://chat-service:8000
      AUTH_JWKS_URL: http://auth-service:8000/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-cogo-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-cogo-api}
    secrets: [{ source: chat_ws_key, target: service_key }]
    depends_on:
      chat-service: { condition: service_healthy }
      redis: { condition: service_healthy }

  # ---------------------------------------------------------------- notification
  notification-migrate:
    <<: *service
    restart: "no"
    image: cogo/notification-service:dev
    build: &notification-build
      context: ./services/notification
      additional_contexts: { common: ./libs/common }
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: *notification-db-url
    depends_on:
      postgres: { condition: service_healthy }

  notification-service:
    <<: *service
    image: cogo/notification-service:dev
    build: *notification-build
    environment:
      <<: *common-env
      RABBITMQ_URL: *rabbit-url
      REDIS_URL: redis://redis:6379/1
      REALTIME_REDIS_URL: *realtime-redis
      DATABASE_URL: *notification-db-url
      AUTH_JWKS_URL: http://auth-service:8000/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-cogo-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-cogo-api}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-mock}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-CoGo <no-reply@cogo.app>}
    depends_on:
      notification-migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth-service: { condition: service_healthy }

  # ---------------------------------------------------------------- edge
  api-gateway:
    <<: *service
    image: cogo/api-gateway:dev
    build:
      context: ./services/api-gateway
      additional_contexts: { common: ./libs/common }
    environment:
      <<: *common-env
      REDIS_URL: redis://redis:6379/2
      AUTH_SERVICE_URL: http://auth-service:8000
      USER_SERVICE_URL: http://user-service:8000
      JOURNEY_SERVICE_URL: http://journey-service:8000
      SOCIAL_SERVICE_URL: http://social-service:8000
      CHAT_SERVICE_URL: http://chat-service:8000
      CHAT_WS_URL: ws://chat-ws:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      AUTH_JWKS_URL: http://auth-service:8000/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-cogo-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-cogo-api}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-[]}
      FORWARDED_ALLOW_IPS: ${GATEWAY_FORWARDED_ALLOW_IPS:-127.0.0.1}
      METRICS_PORT: "9100"
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      redis: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      user-service: { condition: service_healthy }
      journey-service: { condition: service_healthy }
      social-service: { condition: service_healthy }
      chat-service: { condition: service_healthy }
      chat-ws: { condition: service_healthy }
      notification-service: { condition: service_healthy }

  # ---------------------------------------------------------------- observability (opt-in)
  # make obs-up   (and set OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 in .env for traces)
  jaeger:
    <<: *service
    profiles: [observability]
    image: jaegertracing/jaeger:2.23.0
    ports: ["127.0.0.1:16686:16686"]

  prometheus:
    <<: *service
    profiles: [observability]
    image: prom/prometheus:v3.16.0
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    <<: *service
    profiles: [observability]
    image: grafana/grafana:13.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes: ["./infra/grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["127.0.0.1:3001:3000"]

secrets:
  jwt_private_key:
    file: ./secrets/jwt_private_key.pem
  user_service_key:
    file: ./secrets/service-keys/user-service.pem
  journey_service_key:
    file: ./secrets/service-keys/journey-service.pem
  social_service_key:
    file: ./secrets/service-keys/social-service.pem
  chat_service_key:
    file: ./secrets/service-keys/chat-service.pem
  chat_ws_key:
    file: ./secrets/service-keys/chat-ws.pem

networks:
  backend:

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  mediadata:
