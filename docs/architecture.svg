<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>CoGo backend architecture</title>
  <desc>Clients reach an API gateway, which routes to auth-service and user-service. Each service owns its database. auth-service publishes events through RabbitMQ to user-service and notification-service.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/>
    </marker>
    <marker id="arrow-evt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7B4FB3"/>
    </marker>
    <marker id="arrow-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/>
    </marker>
    <style>
      .title { font-size: 15px; font-weight: 700; fill: #1F3A5F; }
      .title-inv { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
      .body { font-size: 11.5px; fill: #2D3748; }
      .body-inv { font-size: 11.5px; fill: #DCE6F1; }
      .small { font-size: 10.5px; fill: #4A5568; }
      .label { font-size: 10.5px; fill: #1F3A5F; font-weight: 600; }
      .label-evt { font-size: 10.5px; fill: #6B3FA3; font-weight: 600; }
      .label-key { font-size: 10.5px; fill: #975A16; font-weight: 600; }
      .muted { font-size: 11px; fill: #718096; }
      .svc { fill: #EAF2FB; stroke: #1F3A5F; stroke-width: 1.5; }
      .store { fill: #F7F8FA; stroke: #8A99AD; stroke-width: 1.2; }
      .planned { fill: #FAFAFA; stroke: #A0AEC0; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .sync { stroke: #1F3A5F; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .evt { stroke: #7B4FB3; stroke-width: 1.8; fill: none; stroke-dasharray: 7 4; marker-end: url(#arrow-evt); }
      .key { stroke: #B7791F; stroke-width: 1.5; fill: none; stroke-dasharray: 2 3; marker-end: url(#arrow-key); }
    </style>
  </defs>

  <rect width="1280" height="900" fill="#FFFFFF"/>

  <!-- ===================== Top row: observability, clients, planned ===================== -->
  <rect class="planned" x="40" y="24" width="300" height="122" rx="10"/>
  <text class="title" x="56" y="48">Observability (opt-in)</text>
  <text class="body" x="56" y="70">Prometheus scrapes /metrics</text>
  <text class="body" x="56" y="88">  (gateway on internal :9100)</text>
  <text class="body" x="56" y="106">Jaeger: OTLP traces, linked by</text>
  <text class="body" x="56" y="124">  X-Request-Id across HTTP + events</text>
  <text class="small" x="56" y="140">Grafana dashboards · make obs-up</text>

  <rect x="490" y="24" width="300" height="52" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
  <text class="title" x="640" y="47" text-anchor="middle">Clients</text>
  <text class="body" x="640" y="65" text-anchor="middle">iOS · Android · Web</text>

  <rect class="planned" x="940" y="24" width="300" height="122" rx="10"/>
  <text class="title" x="956" y="48">Phase 3 (planned)</text>
  <text class="body" x="956" y="70">trip-service: trips + routes (PostGIS)</text>
  <text class="body" x="956" y="88">match-service: H3 cells × time buckets</text>
  <text class="body" x="956" y="106">connection-service: requests, blocks</text>
  <text class="body" x="956" y="124">media (S3 presigned) · chat · push</text>
  <text class="small" x="956" y="140">same template as user-service</text>

  <!-- Clients -> LB -> gateway -->
  <line class="sync" x1="640" y1="76" x2="640" y2="106"/>
  <text class="label" x="650" y="96">HTTPS</text>
  <rect class="planned" x="490" y="108" width="300" height="38" rx="8"/>
  <text class="body" x="640" y="132" text-anchor="middle">Load balancer / CDN — TLS (production)</text>
  <line class="sync" x1="640" y1="146" x2="640" y2="182"/>

  <!-- ===================== Gateway ===================== -->
  <rect x="390" y="184" width="500" height="84" rx="12" fill="#1F3A5F"/>
  <text class="title-inv" x="640" y="208" text-anchor="middle">api-gateway — the only public entry point</text>
  <text class="body-inv" x="640" y="229" text-anchor="middle">route allowlist (everything else 404) · edge JWT check via JWKS</text>
  <text class="body-inv" x="640" y="246" text-anchor="middle">Redis rate limits (per IP / per user) · streaming proxy, one pool</text>
  <text class="body-inv" x="640" y="262" text-anchor="middle">path hygiene · body cap · CORS allowlist · security headers</text>

  <rect class="store" x="960" y="200" width="260" height="52" rx="8"/>
  <text class="title" x="976" y="222" style="font-size:13px">Redis db2</text>
  <text class="small" x="976" y="240">sliding-window rate-limit counters</text>
  <line class="sync" x1="890" y1="226" x2="958" y2="226"/>

  <!-- gateway -> services -->
  <path class="sync" d="M470,268 L470,284 L230,284 L230,312"/>
  <text class="label" x="252" y="279">/v1/auth/*</text>
  <line class="sync" x1="640" y1="268" x2="640" y2="312"/>
  <text class="label" x="650" y="294">/v1/users/*</text>

  <!-- ===================== Services ===================== -->
  <rect class="svc" x="60" y="314" width="340" height="140" rx="12"/>
  <text class="title" x="78" y="339">auth-service</text>
  <text class="body" x="78" y="361">email OTP: HMAC-stored, 5 tries, cooldown</text>
  <text class="body" x="78" y="379">Google sign-in (Firebase ID token, uid)</text>
  <text class="body" x="78" y="397">one account per person (identity linking)</text>
  <text class="body" x="78" y="415">EdDSA access tokens · publishes JWKS</text>
  <text class="body" x="78" y="433">rotating refresh sessions, reuse detection</text>
  <text class="small" x="78" y="449">transactional outbox, relayed to RabbitMQ</text>

  <rect class="svc" x="470" y="314" width="340" height="140" rx="12"/>
  <text class="title" x="488" y="339">user-service</text>
  <text class="body" x="488" y="361">users &amp; profiles, caller-scoped (/me)</text>
  <text class="body" x="488" y="379">others: public projection only</text>
  <text class="body" x="488" y="397">re-verifies every token (zero trust)</text>
  <text class="body" x="488" y="415">consumes user.registered (inbox, idempotent)</text>
  <text class="small" x="488" y="449">GET /me also creates the row (no race)</text>

  <rect class="svc" x="880" y="314" width="340" height="140" rx="12"/>
  <text class="title" x="898" y="339">notification-service</text>
  <text class="body" x="898" y="361">worker — no public / HTTP send API</text>
  <text class="body" x="898" y="379">consumes notification.email.requested</text>
  <text class="body" x="898" y="397">Jinja2 templates (autoescaped)</text>
  <text class="body" x="898" y="415">dedupe per event · drop expired</text>
  <text class="body" x="898" y="433">retry transient, DLQ permanent</text>
  <text class="small" x="898" y="449">push (FCM) will be another consumer</text>

  <!-- JWKS fetch (dotted) -->
  <line class="key" x1="470" y1="372" x2="402" y2="372"/>
  <text class="label-key" x="404" y="364">JWKS</text>
  <path class="key" d="M520,268 L520,298 L360,298 L360,312"/>
  <text class="label-key" x="374" y="309">JWKS</text>

  <!-- ===================== Per-service stores ===================== -->
  <rect class="store" x="60" y="494" width="150" height="78" rx="8"/>
  <text class="title" x="72" y="516" style="font-size:13px">Postgres</text>
  <text class="small" x="72" y="533">authdb · role auth_svc</text>
  <text class="small" x="72" y="549">accounts, identities,</text>
  <text class="small" x="72" y="563">  outbox, audit</text>
  <rect class="store" x="250" y="494" width="150" height="78" rx="8"/>
  <text class="title" x="262" y="516" style="font-size:13px">Redis db0</text>
  <text class="small" x="262" y="533">OTP codes, cooldowns,</text>
  <text class="small" x="262" y="549">refresh sessions (Lua)</text>
  <line class="sync" x1="135" y1="454" x2="135" y2="492"/>
  <line class="sync" x1="325" y1="454" x2="325" y2="492"/>

  <rect class="store" x="470" y="494" width="180" height="78" rx="8"/>
  <text class="title" x="482" y="516" style="font-size:13px">Postgres</text>
  <text class="small" x="482" y="533">userdb · role user_svc</text>
  <text class="small" x="482" y="549">users, user_profiles,</text>
  <text class="small" x="482" y="563">  processed_events</text>
  <line class="sync" x1="560" y1="454" x2="560" y2="492"/>

  <rect class="store" x="880" y="494" width="150" height="78" rx="8"/>
  <text class="title" x="892" y="516" style="font-size:13px">Redis db1</text>
  <text class="small" x="892" y="533">sent-email ids</text>
  <text class="small" x="892" y="549">(idempotency, 24 h)</text>
  <rect class="store" x="1070" y="494" width="150" height="78" rx="8"/>
  <text class="title" x="1082" y="516" style="font-size:13px">SMTP relay</text>
  <text class="small" x="1082" y="533">dev: Mailpit :8025</text>
  <text class="small" x="1082" y="549">prod: SES / SendGrid</text>
  <line class="sync" x1="955" y1="454" x2="955" y2="492"/>
  <line class="sync" x1="1145" y1="454" x2="1145" y2="492"/>

  <!-- ===================== RabbitMQ band ===================== -->
  <rect x="60" y="612" width="1160" height="92" rx="12" fill="#F3EDFA" stroke="#7B4FB3" stroke-width="1.5"/>
  <text class="title" x="78" y="636" style="fill:#5A2D91">RabbitMQ</text>
  <text class="body" x="78" y="656">exchange cogo.events (topic) · dead letters to cogo.dlx</text>
  <text class="body" x="78" y="674">quorum queues, delivery-limit 5, one DLQ each</text>
  <text class="small" x="78" y="693">at-least-once; every consumer is idempotent</text>
  <rect x="660" y="644" width="210" height="44" rx="6" fill="#FFFFFF" stroke="#7B4FB3"/>
  <text class="small" x="765" y="662" text-anchor="middle">queue</text>
  <text class="label-evt" x="765" y="678" text-anchor="middle">user-service.user.registered</text>
  <rect x="1000" y="644" width="200" height="44" rx="6" fill="#FFFFFF" stroke="#7B4FB3"/>
  <text class="small" x="1100" y="662" text-anchor="middle">queue</text>
  <text class="label-evt" x="1100" y="678" text-anchor="middle">notification.email</text>

  <!-- events -->
  <line class="evt" x1="230" y1="454" x2="230" y2="610"/>
  <text class="label-evt" x="238" y="590">user.registered (outbox)</text>
  <text class="label-evt" x="238" y="604">notification.email.requested</text>
  <line class="evt" x1="740" y1="642" x2="740" y2="456"/>
  <text class="label-evt" x="748" y="476">user.registered</text>
  <line class="evt" x1="1050" y1="642" x2="1050" y2="456"/>
  <text class="label-evt" x="1058" y="600">notification.email.requested</text>

  <!-- ===================== Shared library ===================== -->
  <rect x="60" y="732" width="1160" height="58" rx="12" fill="#FFF6E5" stroke="#C9962B" stroke-width="1.5"/>
  <text class="title" x="78" y="756" style="fill:#8A5A00">cogo-common</text>
  <text class="body" x="190" y="756">shared library used by every service: structured JSON logs (request_id, user_id) · error envelope · JWKS + token verifier</text>
  <text class="body" x="190" y="776">DB/Redis/HTTP pools · outbox relay (SKIP LOCKED) · inbox · RabbitMQ topology-as-code · event contracts · OpenTelemetry + Prometheus</text>

  <!-- ===================== Legend ===================== -->
  <text class="title" x="60" y="826" style="font-size:13px">Legend</text>
  <line class="sync" x1="130" y1="822" x2="180" y2="822"/>
  <text class="muted" x="188" y="826">synchronous HTTP / DB call</text>
  <line class="evt" x1="370" y1="822" x2="420" y2="822"/>
  <text class="muted" x="428" y="826">asynchronous message (RabbitMQ)</text>
  <line class="key" x1="640" y1="822" x2="690" y2="822"/>
  <text class="muted" x="698" y="826">public-key fetch (JWKS, cached)</text>
  <rect class="planned" x="900" y="812" width="40" height="18" rx="4"/>
  <text class="muted" x="948" y="826">optional / planned</text>
  <text class="small" x="60" y="856">Database per service: each service owns its schema and login role and never reads another's tables. State crosses services only as events.</text>
  <text class="small" x="60" y="874">Redis db0–db2 are logical databases on one instance in dev; use separate instances in production (sessions: persistent, noeviction).</text>
</svg>
