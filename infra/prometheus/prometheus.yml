global:
  scrape_interval: 15s

scrape_configs:
  - job_name: auth-service
    static_configs: [{ targets: ["auth-service:8000"] }]
  - job_name: user-service
    static_configs: [{ targets: ["user-service:8000"] }]
  - job_name: notification-service
    static_configs: [{ targets: ["notification-service:8000"] }]
  - job_name: api-gateway
    static_configs: [{ targets: ["api-gateway:9100"] }]  # internal metrics port
  - job_name: rabbitmq
    static_configs: [{ targets: ["rabbitmq:15692"] }]
